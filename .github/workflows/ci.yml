name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-targets 2>&1 | tee test-output.txt

      # Job logs need admin rights to download through the API; annotations do not, and
      # they show up in the run's summary either way. Without this, a platform-specific
      # failure is visible only to someone who can open the log in a browser — which is
      # how a Windows-only break here turned into a round of guessing.
      - name: Surface the failure as an annotation
        if: failure()
        shell: bash
        run: |
          # -A3: a panic's *message* is on the line after "panicked at <file>:<line>:",
          # so matching that line alone reported where it broke and never what broke —
          # which cost a diagnosis round the first time this fired.
          detail=$(grep -E -A3 "^test .*FAILED|panicked at|^assertion" test-output.txt | head -60)
          if [ -z "$detail" ]; then
            detail=$(tail -40 test-output.txt)
          fi
          # Annotations are single-line; %0A is how a newline is encoded in one.
          echo "::error title=${{ matrix.os }} tests::$(echo "$detail" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"

      - name: Build release
        run: cargo build --release

  unsafe-boundary:
    name: unsafe confined to security.rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The crate root sets `#![deny(unsafe_code)]`. `forbid` is not usable there
      # because the FFI in security.rs needs a local override, and `forbid` is by
      # design not overridable. This job supplies the missing half of the guarantee:
      # the override may exist in exactly one audited file.
      # Matches the attribute form as a fixed string, so prose in a doc comment that
      # merely mentions the override does not trip the job.
      - name: Reject unsafe_code overrides outside src/security.rs
        run: |
          offenders=$(grep -rlnF '#![allow(unsafe_code)]' src/ | grep -v '^src/security.rs$' || true)
          if [ -n "$offenders" ]; then
            echo "unsafe_code is allowed outside the audited module:"
            echo "$offenders"
            exit 1
          fi
          echo "OK: unsafe_code override confined to src/security.rs"

  progress-doc-limit:
    name: progress docs within 500 chars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docs/progress/README.md rule 1 caps each log at 500 characters. It was being
      # enforced by nobody, so it drifted.
      - name: Check character limits
        run: |
          status=0
          for f in docs/progress/*.md; do
            [ "$(basename "$f")" = "README.md" ] && continue
            n=$(wc -m < "$f")
            if [ "$n" -gt 500 ]; then
              echo "$f is $n characters (limit 500)"
              status=1
            fi
          done
          exit $status

  mutants:
    name: mutation coverage of changed code
    runs-on: ubuntu-latest
    env:
      # Undo the workflow-wide `RUSTFLAGS: -D warnings` for this job only. Stubbing a
      # function to `Ok(())` leaves its parameters unused, so with warnings as errors
      # the mutant fails to compile and cargo-mutants files it under "unviable" rather
      # than "missed" — silently discarding the most valuable class of mutant while the
      # job still reports success. Measured: the same diff yields 45 mutants with 41
      # caught here, and 13 mutants all "unviable" with `-D warnings` set.
      RUSTFLAGS: ""
    # A missed mutant is code a test executes without checking. This project has shipped
    # two of them: a stderr flood sent through a `dd | tr` pipeline so the shell survived
    # and the test proved nothing, and a Ctrl-modifier guard whose test passed with the
    # guard deleted. Both were found by hand, by removing the fix and re-running. This
    # job does the same thing mechanically.
    #
    # Scoped to the diff, not the crate. A full run is 953 mutants and about 3.6 hours,
    # and it would fail on day one: `src/config.rs` alone has 9 missed out of 27,
    # including `restrict_to_owner -> Ok(())` — deleting the permission restriction
    # entirely is caught by nothing. Those are worth fixing, but blocking every push on
    # a pre-existing backlog would only teach people to ignore a red job. Requiring it
    # of *changed* lines stops the backlog growing.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # `--in-diff` needs the base commit present to diff against.
          fetch-depth: 0

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Collect the changed lines
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          # A new branch reports an all-zero "before", and the first commit in a
          # repository has no parent at all. Fall back, then give up quietly rather
          # than failing the job over a diff that cannot exist.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "no base commit to diff against; nothing to mutate"
            : > changed.diff
          else
            echo "diffing $base..HEAD"
            git diff "$base" HEAD > changed.diff
          fi
          wc -l < changed.diff

      - name: Mutate the changed lines
        run: |
          if [ ! -s changed.diff ]; then
            echo "empty diff; nothing to mutate"
            exit 0
          fi
          # `--timeout` bounds a mutant that makes the suite hang rather than fail —
          # `Workspace::precheck -> Ok(())` does exactly that today.
          cargo mutants --in-diff changed.diff --jobs 2 --timeout 120

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Advisory scan
        run: cargo audit --deny warnings
