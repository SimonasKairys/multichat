[package]
name = "simon"
version = "0.1.0"
edition = "2024"
description = "Zero-trust terminal chat for local and cloud LLMs"
license = "MIT OR Apache-2.0"

[[bin]]
name = "simon"
path = "src/main.rs"

[dependencies]
# Narrowed from `features = ["full"]`, which pulls in the whole runtime — net, signal,
# fs, io-std and the rest — when this crate uses a specific handful. Each entry below
# is here because something in `src/` needs it: `rt-multi-thread` and `macros` for
# `#[tokio::main]`/`#[tokio::test]` and `select!`/`join!`, `sync` for the mpsc channels
# the orchestrator and UI talk over, `time` for every timeout and the spinner interval,
# `process` for spawning model CLIs, and `io-util` for the bounded readers in
# `providers::local_binary`. `reqwest` enables whatever transport features it needs on
# its own, so they do not belong here.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
] }
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
    "socks",
], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Default feature `v1` enables the native store for each platform (Keychain, Windows
# Credential Manager, Secret Service).
keyring = "4"
secrecy = "0.8"
anyhow = "1"
directories = "5"
thiserror = "1"
aes-gcm = "0.10"
argon2 = "0.5"
blake2 = "0.10"
async-trait = "0.1"
futures = "0.3"
rpassword = "7"
zeroize = "1"
# `#[cfg_attr(test, mutants::skip)]` marks functions cargo-mutants should not mutate
# (an OS-keyring boundary this suite cannot exercise in CI — see config.rs). Must be a
# regular dependency, not a dev-dependency: the annotation sits on non-test code, so it
# has to resolve in ordinary builds too, not just `cargo test`.
mutants = "0.0.3"

# One `cfg(unix)` block rather than a per-OS block each. `security.rs` guards the
# platform-specific calls internally (`mlockall` is Linux-only, per-allocation `mlock`
# is every unix), so listing Linux and macOS separately only meant that adding a third
# unix would need a third identical stanza.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Memory",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3"
# `test-util` enables tokio's paused clock, so the delegation-retry tests exercise the
# real backoff loop without spending its 11 seconds of wall time.
tokio = { version = "1", features = ["test-util"] }
